<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mestreech Vendaog</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: #000; color: #f8fafc; display: flex; justify-content: center; min-height: 100vh; }
#app { width: 100%; max-width: 600px; background: #090d16; min-height: 100vh; display: flex; flex-direction: column; position: relative; padding-bottom: 70px; }

/* HEADER MET ECHTE WAPPERENDE MAASTRICHTSE VLAG */
header {
  position: sticky;
  top: 0;
  z-index: 40;
  background-color: #ba0c2f;
  background-image: linear-gradient(180deg, rgba(10, 14, 23, 0.25) 0%, rgba(10, 14, 23, 0.75) 100%), url('https://images.unsplash.com/photo-1542385151-efd9000785a0?auto=format&fit=crop&w=800&q=80');
  background-size: cover;
  background-position: center;
  border-bottom: 1px solid rgba(255, 255, 255, 0.15);
  padding: 14px 14px 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.6);
}

.header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.title { font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.7); letter-spacing: -0.3px; line-height: 1.1; }
.sub { font-size: 11px; color: #f1f5f9; text-shadow: 0 1px 4px rgba(0,0,0,0.8); font-weight: 600; margin-top: 2px; }

.btn-live { 
  background: rgba(0,0,0,0.45); 
  backdrop-filter: blur(8px); 
  border: 1px solid rgba(255,255,255,0.25); 
  color: #fff; 
  font-size: 11px; 
  font-weight: 700; 
  padding: 5px 10px; 
  border-radius: 20px; 
  cursor: pointer; 
}

.tab-row { 
  display: grid; 
  grid-template-columns: 1fr 1fr; 
  background: rgba(0,0,0,0.45); 
  backdrop-filter: blur(10px); 
  padding: 3px; 
  border-radius: 12px; 
  gap: 4px; 
  border: 1px solid rgba(255,255,255,0.15); 
}

.tab-btn { 
  border: none; 
  padding: 8px 0; 
  font-size: 12px; 
  font-weight: 800; 
  border-radius: 9px; 
  cursor: pointer; 
  color: #e2e8f0; 
  background: transparent; 
  transition: all 0.2s ease;
}
.tab-btn.act-news { background: rgba(200, 16, 46, 0.9); color: #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }
.tab-btn.act-cal { background: rgba(255, 199, 44, 0.95); color: #090d16; box-shadow: 0 2px 6px rgba(0,0,0,0.5); font-weight: 900; }

.search-box { margin-top: 10px; }
.search-input { 
  width: 100%; 
  background: rgba(9, 13, 22, 0.75); 
  backdrop-filter: blur(10px); 
  border: 1px solid rgba(255,255,255,0.2); 
  color: #fff; 
  padding: 8px 12px; 
  border-radius: 10px; 
  font-size: 12px; 
  outline: none; 
}
.search-input::placeholder { color: #cbd5e1; }

.feed { padding: 12px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.card { background: #131b2e; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; cursor: pointer; }
.img-wrap { width: 100%; height: 160px; position: relative; background: #1e293b; }
.img-wrap img { width: 100%; height: 100%; object-fit: cover; }
.badge { position: absolute; top: 8px; left: 8px; background: #C8102E; color: #fff; font-size: 10px; font-weight: 800; padding: 3px 7px; border-radius: 4px; }
.badge.gold { background: #FFC72C; color: #000; font-weight: 900; }
.badge.teal { background: #0d9488; }
.badge.alert112 { background: #ef4444; color: #fff; font-weight: 900; }
.badge.yt { background: #e11d48; color: #fff; font-weight: 900; }
.card-time { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.75); backdrop-filter: blur(4px); color: #e2e8f0; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
.card-body { padding: 10px 12px 12px; }
.card-title { font-size: 14px; font-weight: 800; color: #fff; margin-bottom: 4px; line-height: 1.35; }
.card-desc { font-size: 12px; color: #94a3b8; line-height: 1.45; margin-bottom: 8px; }
.card-foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 6px; font-size: 11px; font-weight: 700; color: #FFC72C; }
.btn-share { background: rgba(255,255,255,0.1); border: none; color: #e2e8f0; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 6px; cursor: pointer; }

#toast { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); background: #1e293b; color: #fff; border: 1px solid #C8102E; padding: 8px 14px; border-radius: 20px; font-size: 11px; font-weight: bold; z-index: 10000; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }

#viewer { position: fixed; inset: 0; background: #090d16; z-index: 9999; display: none; flex-direction: column; }
.v-bar { background: #131b2e; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
.v-close { background: #C8102E; color: #fff; border: none; font-size: 11px; font-weight: 800; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
.v-title { color: #fff; font-size: 12px; font-weight: 700; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.v-ext { color: #FFC72C; font-size: 11px; font-weight: 700; text-decoration: none; }
#frame { flex: 1; border: none; background: #000; }

nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; background: rgba(9,13,22,0.96); backdrop-filter: blur(12px); border-top: 1px solid #1e293b; display: flex; justify-content: space-around; padding: 8px 0; z-index: 50; }
.n-btn { background: none; border: none; color: #94a3b8; font-size: 11px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.n-btn.act { color: #C8102E; }
.n-btn.act-g { color: #FFC72C; }
</style>
</head>
<body>
<div id="app">
<div id="toast"></div>

<!-- HEADER ZONDER LOS STER-ICOON, VOLLEDIGE VLAG-ACHTERGROND -->
<header>
  <div class="header-row">
    <div>
      <div class="title">Mestreech Vendaog</div>
      <div class="sub">Nuijts, Callepin & Grensregio</div>
    </div>
    <button onclick="fetchLive()" class="btn-live">● <span id="stTxt">Live feed</span></button>
  </div>
  <div class="tab-row">
    <button id="tbN" onclick="setTab('nieuws')" class="tab-btn act-news">📰 Mestreechs Nuijts</button>
    <button id="tbA" onclick="setTab('agenda')" class="tab-btn">📒 Callepin</button>
  </div>
  <div class="search-box">
    <input type="text" id="q" oninput="doSearch(this.value)" placeholder="Zeuk in nuijts, Wyck, Bieste, 112..." class="search-input">
  </div>
</header>

<div id="newsFeed" class="feed"></div>
<div id="agendaFeed" class="feed" style="display:none;">
