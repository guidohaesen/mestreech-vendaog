name: Build Android APK
​on:
push:
branches: [ main, master ]
workflow_dispatch:
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Code ophalen
uses: actions/checkout@v4
​- name: Node.js 20 instellen
uses: actions/setup-node@v4
with:
node-version: 20
​- name: Java JDK 17 instellen
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
​- name: Android SDK Licenties Accepteren
run: |
yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
​- name: Dependencies en Capacitor project opbouwen
run: |
npm install
mkdir -p www
cp -f maastricht_nieuws_app.html www/index.html 2>/dev/null || true
npx cap add android || true
npx cap sync android
​- name: APK compileren met Gradle
working-directory: android
run: |
chmod +x gradlew
./gradlew assembleDebug --no-daemon --stacktrace
​- name: APK uploaden als downloadbaar bestand
uses: actions/upload-artifact@v4
with:
name: Mestreech-Vendaog-APK
path: android/app/build/outputs/apk/debug/app-debug.apk