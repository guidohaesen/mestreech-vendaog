name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js 20 installeren
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java JDK 17 instellen
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Android SDK klaarzetten
        uses: android-actions/setup-android@v3

      - name: Dependencies en Capacitor installeren
        run: |
          npm install
          npx cap init "Mestreech Vendaog" "nl.mestreechvendaog.app" --web-dir www
          npx cap add android
          npx cap sync android

      - name: APK compileren met Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK uploaden als downloadbaar bestand
        uses: actions/upload-artifact@v4
        with:
          name: Mestreech-Vendaog-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
