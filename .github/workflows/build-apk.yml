name: Build Android APK
​on:
push:
branches: [ main, master ]
workflow_dispatch: # Zorgt ervoor dat je de build ook met de hand kunt starten
​jobs:
build:
runs-on: ubuntu-latest
​steps:
- name: Code ophalen
uses: actions/checkout@v4
​- name: Node.js installeren
uses: actions/setup-node@v4
with:
node-version: 20
​- name: Java JDK 17 instellen
uses: actions/setup-java@v4
with:
distribution: 'zulu'
java-version: '17'
​- name: Android SDK klaarzetten
uses: android-actions/setup-android@v3
​- name: Dependencies installeren
run: |
npm install
​- name: Capacitor Android toevoegen & synchroniseren
run: |
npx cap add android
npx cap sync android
​- name: APK compileren met Gradle
working-directory: android
run: |
chmod +x gradlew
./gradlew assembleDebug --stacktrace
​- name: APK uploaden als downloadbaar bestand
uses: actions/upload-artifact@v4
with:
name: Mestreech-Vendaog-APK
path: android/app/build/outputs/apk/debug/app-debug.apk