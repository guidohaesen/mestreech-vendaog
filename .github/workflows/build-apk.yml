name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - run: npm install
      - run: node scripts/scraper.js || true
      - run: npx cap add android || true
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Mestreech-Vendaog.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Mestreech Vendaog Actuele Versie
          files: Mestreech-Vendaog.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
