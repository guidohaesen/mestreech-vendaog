name: Update Live Nieuws Data

on:
  schedule:
    - cron: '0 * * * *' # Draait automatisch elk uur
  workflow_dispatch:     # Laat je ook handmatig op 'Run' drukken

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Code ophalen
        uses: actions/checkout@v4

      - name: Node.js instellen
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scraper uitvoeren
        run: node scripts/scraper.js

      - name: Wijzigingen opslaan in GitHub
        run: |
          git config --global user.name "Mestreech Bot"
          git config --global user.email "bot@mestreechvendaog.nl"
          git add www/news_data.json
          git commit -m "Auto-update nieuws data [skip ci]" || exit 0
          git push
