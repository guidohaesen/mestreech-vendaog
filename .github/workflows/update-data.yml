name: Update Live Data
​on:
schedule:
- cron: '0 * * * *'
workflow_dispatch:
​permissions:
contents: write
​jobs:
scrape:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4
​- uses: actions/setup-node@v4
with:
node-version: 20
​- name: Run
run: node scripts/scraper.js
​- name: Push
run: |
git config user.name "bot"
git config user.email "bot@test.com"
git add www/news_data.json
git commit -m "update" || exit 0
git push